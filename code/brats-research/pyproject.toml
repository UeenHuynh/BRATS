[project]
name = "brats-research"
version = "0.1.0"
description = "BraTS-MEN-RT research codebase"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy==1.26.4",
  "pyyaml==6.0.2",
  "simpleitk==2.4.1",
  "torch>=2.2.0",
  "totalsegmentator>=2.18.0",
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "ruff==0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["archive", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["brats"]
exclude = ["archive", "data", "outputs"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
